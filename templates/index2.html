<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="#">BLOCKCHAIN DEMO</a>

<div class="container">
    <div class="row mt-5">
        <div class="col-md-6">
            <h3 class="text-center">Miner Server</h3>
            <div class="d-flex justify-content-center">
                <button id="minerRun" class="btn btn-primary">Run</button>
                <button id="minerStop" class="btn btn-danger">Stop</button>
            </div>
            <div id="minerOutput" class="output-box mt-3"></div>
        </div>
        <div class="col-md-6">
            <h3 class="text-center"> Dig</h3>
            <div class="d-flex justify-content-center">
                <button id="digRun" class="btn btn-primary">Run</button>
                <button id="digStop" class="btn btn-danger">Stop</button>
            </div>
            <div id="digOutput" class="output-box mt-3"></div>
        </div>
    </div>
</div>

<div class="container mt-5" style="width: 60%">
    <h1 class="text-center mb-4">Transaction Information</h1>
    <form id="transactionForm">
        <div id="InquiryResult"></div>
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="from">From:</label>
                    <input type="text" id="from" name="from" class="form-control" required>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label for="to">To:</label>
                    <input type="text" id="to" name="to" class="form-control" required>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="amount">Amount:</label>
                    <input type="number" id="amount" name="amount" class="form-control" required>
                </div>
            </div>
            <div class="col-md-6">
                <br>
                <button type="submit" class="btn btn-primary" style="margin-top: 1%">Submit Transaction</button>
            </div>
        </div>

    </form>
</div>
<div class="container mt-5">
    <div style="text-align: center;">
        <button id="inquiryBtn" class="btn btn-primary mb-4">Query Transaction List</button>
    </div>
    <div class="blockchain-window">
        <div id="ledgerTable" class="table-responsive"></div>
    </div>
</div>
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h5>自然语言交易</h5>
        </div>
        <div class="card-body">
            <form id="nlTransactionForm">
                <div class="form-group">
                    <label for="transactionText">请输入交易描述：</label>
                    <input type="text" class="form-control" id="transactionText" 
                           placeholder="例如：Alice向Bob转账5个币">
                </div>
                <button type="submit" class="btn btn-primary mt-2">提交交易</button>
            </form>
            <div id="transactionResult" class="mt-3"></div>
        </div>
    </div>
</div>
<script>
    $(document).ready(function () {

        // Handle form submission
        $('#transactionForm').submit(function (event) {
            event.preventDefault();
            const formData = $(this).serialize();

            // 显示加载状态
            $('#InquiryResult').html('<p class="text-info">Processing transaction...</p>');

            $.ajax({
                url: '/process',
                method: 'POST',
                data: formData,
                success: function (response) {
                    if (response.status === 'success') {
                        $('#InquiryResult').html(`
                            <div class="alert alert-success">
                                ${response.message}
                            </div>
                        `);
                        // 自动刷新区块链数据
                        refreshBlockchainData();
                    } else if (response.status === 'warning') {
                        $('#InquiryResult').html(`
                            <div class="alert alert-warning">
                                ${response.message}
                                <br>
                                <small>Note: Transaction may still be processed despite timeout.</small>
                            </div>
                        `);
                        // 延迟刷新区块链数据，给一些时间让交易完成
                        setTimeout(refreshBlockchainData, 5000);
                    } else {
                        $('#InquiryResult').html(`
                            <div class="alert alert-danger">
                                ${response.message}
                                <br>
                                <small>Please check the blockchain data to confirm transaction status.</small>
                            </div>
                        `);
                        // 延迟刷新区块链数据
                        setTimeout(refreshBlockchainData, 5000);
                    }
                },
                error: function (xhr) {
                    let errorMessage = 'Error processing transaction.';
                    if (xhr.responseJSON && xhr.responseJSON.message) {
                        errorMessage = xhr.responseJSON.message;
                    }
                    $('#InquiryResult').html(`
                        <div class="alert alert-warning">
                            ${errorMessage}
                            <br>
                            <small>Note: Your transaction might still be processed. Please check the blockchain data.</small>
                        </div>
                    `);
                    // 延迟刷新区块链数据
                    setTimeout(refreshBlockchainData, 5000);
                }
            });
        });

        // 添加区块链数据刷新函数
        function refreshBlockchainData() {
            $.ajax({
                url: '/inquiry',
                method: 'GET',
                success: function (data) {
                    renderTable(data);
                    // 添加刷新提示
                    $('#ledgerTable').prepend(`
                        <div class="alert alert-info alert-dismissible fade show" role="alert">
                            Blockchain data refreshed
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                    `);
                },
                error: function () {
                    $('#ledgerTable').prepend(`
                        <div class="alert alert-warning alert-dismissible fade show" role="alert">
                            Error refreshing blockchain data. Please try again.
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                    `);
                }
            });
        }

        // 修改查询按钮点击事件
        $('#inquiryBtn').click(function () {
            refreshBlockchainData();
        });

        function renderTable(data) {
            let table = `
                <table class="table">
                    <thead class="thead-dark" style="position: sticky; top: 0; z-index: 1;">
                        <tr>
                            <th>Index</th>
                            <th>Timestamp</th>
                            <th>Proof of Work</th>
                            <th>Transactions</th>
                            <th>Previous Hash</th>
                            <th>Hash</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(entry => {
                table += `
                    <tr class="block-row">
                        <td class="align-middle">${entry.block_index}</td>
                        <td class="align-middle">${formatTimestamp(entry.timestamp)}</td>
                        <td class="align-middle">${entry.data['proof-of-work']}</td>
                        <td class="transaction-cell">
                            ${renderTransactions(entry.data.transactions)}
                        </td>
                        <td class="align-middle">
                            <div class="text-truncate" style="max-width: 150px;" title="${entry.previous_hash}">
                                ${entry.previous_hash}
                            </div>
                        </td>
                        <td class="align-middle">
                            <div class="text-truncate" style="max-width: 150px;" title="${entry.hash}">
                                ${entry.hash}
                            </div>
                        </td>
                    </tr>
                `;
            });

            table += `
                    </tbody>
                </table>
            `;

            $('#ledgerTable').html(table);
        }

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString();
        }

        function renderTransactions(transactions) {
            if (!transactions || transactions.length === 0) {
                return '<div class="text-muted">No transactions</div>';
            }
            
            return transactions.map(tx => `
                <div class="transaction-item p-2 border-bottom">
                    <div class="small">
                        <strong>From:</strong> ${tx.from}
                    </div>
                    <div class="small">
                        <strong>To:</strong> ${tx.to}
                    </div>
                    <div class="small">
                        <strong>Amount:</strong> ${tx.amount}
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('nlTransactionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const text = document.getElementById('transactionText').value;
            const resultDiv = document.getElementById('transactionResult');
            
            // 显示加载状态
            resultDiv.innerHTML = `
                <div class="alert alert-info">
                    正在处理交易请求...
                </div>
            `;
            
            // 发送请求到解析端点
            fetch('/parse_transaction', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            <h5>交易处理成功！</h5>
                            <p>${data.message}</p>
                            <hr>
                            <p><strong>交易详情：</strong></p>
                            <ul>
                                <li>从: ${data.transaction.from}</li>
                                <li>到: ${data.transaction.to}</li>
                                <li>金额: ${data.transaction.amount}</li>
                            </ul>
                        </div>
                    `;
                    // 清空输入框
                    document.getElementById('transactionText').value = '';
                    // 延迟刷新区块链数据
                    setTimeout(refreshBlockchainData, 5000);
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <h5>处理失败</h5>
                            <p>${data.message}</p>
                        </div>
                    `;
                }
            })
            .catch(error => {
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <h5>系统错误</h5>
                        <p>请求失败：${error}</p>
                    </div>
                `;
            });
        });
    });
</script>
</body>
